    const SQL_DDL_SCRIPT = `-- ====================================================================
-- BANASHRI NEKARARA UTHPADANA MATTU MARATHA SAHAKARA SANGHA NIYAMITA
-- Complete Production Database DDL Schema (PostgreSQL 14+ / Supabase Compliant)
-- ====================================================================

CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

-- 1. LOOM & WEAVER CLASSIFICATION ENUM
CREATE TYPE loom_category AS ENUM ('HANDLOOM_PIT', 'HANDLOOM_FRAME', 'POWERLOOM');
CREATE TYPE uom_type AS ENUM ('PCS', 'MTRS', 'PKT', 'KG');
CREATE TYPE sale_channel AS ENUM ('RETAIL', 'WHOLESALE');
CREATE TYPE job_status AS ENUM ('OPEN', 'CLOSED', 'CANCELLED');

-- 2. WEAVER MEMBERS & SHARE CAPITAL REGISTRY
CREATE TABLE members (
    id VARCHAR(20) PRIMARY KEY,
    full_name VARCHAR(150) NOT NULL,
    phone_number VARCHAR(15) NOT NULL,
    aadhaar_hash VARCHAR(64),
    nekara_samman_id VARCHAR(50) UNIQUE NOT NULL,
    share_capital NUMERIC(12, 2) DEFAULT 5000.00 CHECK (share_capital >= 1000.00),
    is_active BOOLEAN DEFAULT TRUE,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

-- 3. LOOM ASSETS & POWERLOOM HP / RR SUBSIDY REGISTRY
CREATE TABLE looms (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    member_id VARCHAR(20) REFERENCES members(id) ON DELETE RESTRICT,
    loom_type loom_category NOT NULL,
    hp_motor_rating NUMERIC(4, 2) DEFAULT 0.0 CHECK (hp_motor_rating >= 0.0),
    electricity_rr_no VARCHAR(50),
    geo_location VARCHAR(100),
    verified_by_inspector VARCHAR(100)
);

-- 4. YARN & RAW MATERIAL INVENTORY (ಹ್ಯಾಂಕ್ & ಕೋನ್ ಗೋದಾಮು)
CREATE TABLE yarn_inventory (
    id VARCHAR(20) PRIMARY KEY,
    name VARCHAR(120) NOT NULL,
    lot_number VARCHAR(50) NOT NULL,
    yarn_category VARCHAR(50) NOT NULL, -- 'COTTON_HANK', 'POLY_CONE', 'ZARI_SPOOL'
    stock_in_kg NUMERIC(10, 3) NOT NULL CHECK (stock_in_kg >= 0),
    cost_per_kg NUMERIC(10, 2) NOT NULL,
    supplier_name VARCHAR(120),
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

-- 5. FINISHED PRODUCTS CATALOG (ತಾಖಾ, ತುವ್ವಾಲು, ರುಮಾಲು, ದೇವ್ರ ವಸ್ತ್ರ)
CREATE TABLE finished_products (
    id VARCHAR(20) PRIMARY KEY,
    product_name VARCHAR(150) NOT NULL,
    category VARCHAR(50) NOT NULL,
    uom uom_type NOT NULL,
    retail_rate NUMERIC(10, 2) NOT NULL,
    wholesale_rate NUMERIC(10, 2) NOT NULL,
    is_govt_rebate_eligible BOOLEAN DEFAULT FALSE,
    hsn_code VARCHAR(10) DEFAULT '5208'
);

-- 6. PRODUCTION DISPATCH / YARN JOB-WORK (ಹಂಚಿಕೆ ಪುಸ್ತಕ - Hanchike)
CREATE TABLE production_batches (
    batch_id VARCHAR(20) PRIMARY KEY,
    member_id VARCHAR(20) REFERENCES members(id),
    yarn_id VARCHAR(20) REFERENCES yarn_inventory(id),
    weight_issued_kg NUMERIC(8, 3) NOT NULL CHECK (weight_issued_kg > 0),
    target_product_id VARCHAR(20) REFERENCES finished_products(id),
    expected_output_units NUMERIC(8, 2) NOT NULL,
    issue_date DATE DEFAULT CURRENT_DATE,
    status job_status DEFAULT 'OPEN'
);

-- 7. FABRIC INWARD & WAGE / TOLERANCE SETTLEMENT (ದಾಖಲೆ ಪುಸ್ತಕ - Dakhale)
CREATE TABLE production_inwards (
    inward_id VARCHAR(20) PRIMARY KEY,
    batch_id VARCHAR(20) REFERENCES production_batches(batch_id),
    inward_date DATE DEFAULT CURRENT_DATE,
    fabric_weight_kg NUMERIC(8, 3) NOT NULL,
    wastage_returned_kg NUMERIC(8, 3) DEFAULT 0.0,
    units_received NUMERIC(8, 2) NOT NULL,
    actual_loss_kg NUMERIC(8, 3) GENERATED ALWAYS AS 
      (GREATEST(0, (SELECT weight_issued_kg FROM production_batches WHERE batch_id = production_inwards.batch_id) - (fabric_weight_kg + wastage_returned_kg))) STORED,
    loss_percentage NUMERIC(5, 2) NOT NULL,
    wage_rate_per_unit NUMERIC(8, 2) NOT NULL,
    gross_wage NUMERIC(10, 2) NOT NULL,
    penalty_deductions NUMERIC(10, 2) DEFAULT 0.0,
    net_wage_payable NUMERIC(10, 2) NOT NULL
);

-- 8. SALES INVOICES & 20% REBATE SUBSIDY BREAKDOWN
CREATE TABLE sales_invoices (
    invoice_id VARCHAR(25) PRIMARY KEY,
    sale_channel sale_channel NOT NULL,
    sale_date TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    customer_name VARCHAR(150) NOT NULL,
    customer_phone VARCHAR(15),
    gross_total NUMERIC(12, 2) NOT NULL,
    rebate_percentage NUMERIC(4, 2) DEFAULT 20.00,
    rebate_amount NUMERIC(12, 2) DEFAULT 0.00,
    net_collected_amount NUMERIC(12, 2) NOT NULL,
    payment_mode VARCHAR(30) DEFAULT 'CASH'
);

-- 9. SALES INVOICE LINE ITEMS
CREATE TABLE sales_line_items (
    id BIGSERIAL PRIMARY KEY,
    invoice_id VARCHAR(25) REFERENCES sales_invoices(invoice_id) ON DELETE CASCADE,
    product_id VARCHAR(20) REFERENCES finished_products(id),
    quantity NUMERIC(8, 2) NOT NULL,
    unit_rate NUMERIC(10, 2) NOT NULL,
    line_total NUMERIC(12, 2) NOT NULL,
    rebate_applied NUMERIC(10, 2) DEFAULT 0.0
);

-- 10. COOPERATIVE DAY BOOK & DOUBLE-ENTRY CASH JOURNAL (ದಿನ ವಹಿ)
CREATE TABLE day_book_entries (
    entry_id VARCHAR(25) PRIMARY KEY,
    entry_date DATE DEFAULT CURRENT_DATE,
    account_head VARCHAR(100) NOT NULL,
    reference_doc_no VARCHAR(50),
    debit_inflow NUMERIC(12, 2) DEFAULT 0.0,
    credit_outflow NUMERIC(12, 2) DEFAULT 0.0,
    narration TEXT
);

-- INDEXES FOR AUDIT SPEED & QUERIES
CREATE INDEX idx_members_nekara ON members(nekara_samman_id);
CREATE INDEX idx_invoices_date ON sales_invoices(sale_date);
CREATE INDEX idx_inwards_batch ON production_inwards(batch_id);
CREATE INDEX idx_daybook_date ON day_book_entries(entry_date);
`;

      // CSV Export Utility
      const exportTableToCSV = (filename, rows) => {
        if (!rows || !rows.length) return alert("No data to export");
        const separator = ",";
        const keys = Object.keys(rows[0]);
        const csvContent =
          keys.join(separator) +
          "\n" +
          rows.map(row => {
            return keys.map(k => {
              let cell = row[k] === null || row[k] === undefined ? "" : row[k].toString();
              cell = cell.replace(/"/g, '""');
              if (cell.search(/("|,|\n)/g) >= 0) cell = `"${cell}"`;
              return cell;
            }).join(separator);
          }).join("\n");

        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

              <div className="grid grid-cols-2 gap-2">
                <input type="number" step="0.1" placeholder="ತೂಕ (KG)*" value={stockKg} onChange={e => setStockKg(e.target.value)} className="p-2 border rounded-lg" required />
                <input type="number" placeholder="ದರ/KG ₹*" value={ratePerKg} onChange={e => setRatePerKg(e.target.value)} className="p-2 border rounded-lg" required />
              </div>
              <input type="text" placeholder="ಸರಬರಾಜುದಾರರು (Mill / Depot)*" value={supplier} onChange={e => setSupplier(e.target.value)} className="w-full p-2 border rounded-lg" required />
              <div className="flex gap-2 pt-2">
                <button type="submit" className="flex-1 bg-emerald-800 text-white font-bold py-2 rounded-lg">ದಾಸ್ತಾನು ಸೇರಿಸಿ</button>
                <button type="button" onClick={onClose} className="bg-slate-200 px-4 py-2 rounded-lg font-bold">ರದ್ದು</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
